[package]
name = "rookery-test"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
rookery-common = { path = "../rookery-common" }
gb-core = { path = "../gb-core" }
thiserror.workspace = true

[dev-dependencies]
png = "0.18"

[features]
# Keep `cargo test --workspace` independent of external ROM files.
blargg-roms = []

[[test]]
name = "blargg"
required-features = ["blargg-roms"]
